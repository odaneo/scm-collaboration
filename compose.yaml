name: scm-collaboration
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: scm_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-local.ps1 first}
      PROCUREMENT_PASSWORD: ${PROCUREMENT_PASSWORD:?Run scripts/init-local.ps1 first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - procurement-data:/var/lib/postgresql
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-procurement.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scm_admin -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  procurement-data:
